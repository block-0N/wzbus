<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <h1>管理后台</h1>
        <div class="user-info">
            <span id="userEmail"></span>
            <span id="userNick"></span>
            <span class="badge badge-admin">管理员</span>
            <button class="btn btn-danger" onclick="logout()" type="button">退出登录</button>
        </div>
    </nav>
    <div class="container">
        <div class="panel">
            <h2>管理员控制台</h2>
            <p>你拥有管理员权限，可以查看所有注册用户列表。如需设置其他用户为管理员，请在 Supabase 后台修改 profiles 表的 role 字段。</p>
        </div>
        <div class="panel">
            <h2>用户列表</h2>
            <table>
                <thead>
                    <tr>
                        <th>邮箱</th>
                        <th>昵称</th>
                        <th>角色</th>
                        <th>注册时间</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        (async () => {
            const result = await requireAuth("admin");
            if (!result) return;
            const { data: profile } = await getProfile(result.session.user.id);
            document.getElementById("userNick").textContent = profile?.nickname || "未设置昵称";
            document.getElementById("userEmail").textContent = result.session.user.email;
            const { data, error } = await sb.from("profiles").select("*").order("created_at", { ascending: false });
            const tbody = document.getElementById("userTable");
            if (error || !data.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#9ca3af">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(p => `<tr>
                <td>${p.email || "-"}</td>
                <td>${p.nickname || "未设置"}</td>
                <td><span class="badge ${p.role === "admin" ? "badge-admin" : "badge-user"}">${p.role}</span></td>
                <td>${new Date(p.created_at).toLocaleString("zh-CN")}</td>
            </tr>`).join("");
        })();
    </script>
</body>

</html>
