<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
    <link rel="manifest" href="../icons/site.webmanifest">
    <link rel="stylesheet" href="../styles/indexstyle.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <style>
        main {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .08);
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            align-items: center;
            justify-content: center;
            flex: none;
        }

        h3 {
            text-align: center;
        }

        p {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 0;
            font-size: 14px;
        }

        p a {
            color: #2980b9;
        }

        p a:hover {
            text-decoration: underline;
        }

        form button {
            margin: 0 auto;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-logo">温州县域公交</div>
        <nav>
            <a href="../index.html" class="nav-link">首页</a>
            <a href="https://www.mygolbs.com/home" class="nav-link">实时公交</a>
            <a href="../pages/about.html" class="nav-link">关于我们</a>
            <a href="../pages/tips.html" class="nav-link">乘车指南</a>
        </nav>
    </header>

    <h1>登录</h1>

    <main>
        <h3>登录你的block账户继续</h3>
        <div id="msg"></div>
        <form id="loginForm">
            <div>
                <label>邮箱</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div>
                <label>密码</label>
                <input type="password" id="password" required placeholder="至少 6 位">
            </div>
            <button type="submit">登录</button>
        </form>
        <p>还没有账户？<a href="register.html">立即注册</a></p>
    </main>

    <footer>
        <p>温州县域公交信息平台 © 2026 版权所有</p>
        <p>温馨提示：本平台为公益性信息平台，无任何商业运营行为</p>
        <p>数据更新时间：2026年8月</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        (async () => {
            try {
                const session = await getSession();
                if (session) {
                    const { data: profile } = await getProfile(session.user.id);
                    if (profile) window.location.href = profile.role === "admin" ? "admin.html" : "user.html";
                }
            } catch (err) {
                console.error(err);
            }
        })();

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("msg");
            msg.textContent = "";
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const { data, error } = await login(email, password);
                if (error) throw error;
                const { data: profile, error: profileErr } = await getProfile(data.user.id);
                if (profileErr) throw profileErr;
                window.location.href = "../index.html";
            } catch (err) {
                msg.textContent = err.message;
                msg.className = "error";
            }
        });
    </script>
</body>

</html>
