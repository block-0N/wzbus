<!DOCTYPE html>
<html lang="zh-CN">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
    <link rel="manifest" href="../icons/site.webmanifest">
    <link rel="stylesheet" href="../styles/indexstyle.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <style>
        .admin {
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            background-color: #fef3c7;
            color: #b45309;
        }

        .user {
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            background: #dbeafe;
            color: #1d4ed8;
        }

        img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        aside {
            display: flex;
            align-items: center;
            gap: 16px;
            justify-content: end;
        }

        article {
            position: relative;
        }

        article button {
            position: absolute;
            right: 0;
        }
    </style>
</head>


<body>
    <header>
        <div class="nav-logo">温州县域公交</div>
        <nav>
            <a href="../index.html" class="nav-link">首页</a>
            <a href="https://www.mygolbs.com/home" class="nav-link">实时公交</a>
            <a href="about.html" class="nav-link">关于我们</a>
            <a href="tips.html" class="nav-link">乘车指南</a>
        </nav>
    </header>


    <h1>个人中心</h1>

    <aside>
        <img id="avatarPreview" src="" alt="头像">
        <span id="userEmail"></span>
        <span id="userNick"></span>
        <span class="badge"></span>
        <button onclick="logout()" type="button">退出登录</button>
    </aside>

    <main>
        <article>
            <h2>欢迎 👋</h2>
            <p>你已成功登录。这里是普通用户的主页，可以查看个人信息和使用基础功能。</p>
        </article>
        <article>
            <h2>账户信息</h2>
            <p><strong>邮箱：</strong><span id="infoEmail"></span></p>
            <p><strong>用户 ID：</strong><span id="infoId"></span></p>
            <p><strong>角色：</strong><span class="badge badge-user" id="role">user</span></p>
        </article>
        <article>
            <h2>头像设置</h2>
            <label for="avatarInput">
                <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" title="头像设置" hidden>
                <span class="xbtn">选择头像图片</span>
            </label>
            <img id='previewImg' alt="预览">
            <button onclick="uploadAvatar()" type="button">保存头像</button>
        </article>
    </main>


    <footer>
        <p>温州县域公交信息平台 © 2026 版权所有</p>
        <p>温馨提示：本平台为公益性信息平台，无任何商业运营行为</p>
        <p>数据更新时间：2026年8月</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        (async () => {
            const session = await getSession();
            if (!session) {
                location.href = "login.html";
                return;
            }
            const email = session.user.email;
            const id = session.user.id;
            const { data: profile } = await getProfile(session.user.id);

            document.getElementById("userNick").textContent = profile?.nickname || "未设置昵称";
            document.getElementById("userEmail").textContent = email;
            document.getElementById("infoEmail").textContent = email;
            document.getElementById("infoId").textContent = id;

            // 根据角色动态切换标签
            const roleBadge = document.querySelector(".badge");
            if (profile?.role === "admin") {
                roleBadge.className = "badge admin";
                roleBadge.textContent = "管理员";
                document.querySelector("#role").textContent = "admin";
                document.querySelector("#role").className = "badge admin";
            } else {
                roleBadge.className = "badge user";
                roleBadge.textContent = "普通用户";
                document.querySelector("#role").textContent = "user";
                document.querySelector("#role").className = "badge user";
            }
            loadAvatar();
        })();
        const avatarInput = document.getElementById('avatarInput');
        const previewImg = document.getElementById('previewImg');

        avatarInput.addEventListener('change', function () {
            // 如果没有选择文件，直接返回
            if (!this.files || this.files.length === 0) {
                return;
            }
            const file = this.files[0];

            const reader = new FileReader();
            // 读取完成回调，result 就是图片base64地址
            reader.onload = function (e) {
                previewImg.src = e.target.result;
            };
            // 把文件读成 DataURL
            reader.readAsDataURL(file);
        });
    </script>
</body>


</html>
