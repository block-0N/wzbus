<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
    <link rel="manifest" href="../icons/site.webmanifest">
    <link rel="stylesheet" href="../styles/indexstyle.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <style>
        main {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .08);
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            align-items: center;
            justify-content: center;
            flex: none;
        }

        h3 {
            text-align: center;
        }

        p {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 0;
            font-size: 14px;
        }

        p a {
            color: #2980b9;
        }

        p a:hover {
            text-decoration: underline;
        }

        form button {
            margin: 0 auto;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-logo">温州县域公交</div>
        <nav>
            <a href="../index.html" class="nav-link">首页</a>
            <a href="https://www.mygolbs.com/home" class="nav-link">实时公交</a>
            <a href="../pages/about.html" class="nav-link">关于我们</a>
            <a href="../pages/tips.html" class="nav-link">乘车指南</a>
        </nav>
    </header>

    <h1>注册</h1>

    <main>
        <h3>注册block账户</h3>
        <div id="msg"></div>
        <form id="registerForm">
            <div>
                <label>昵称</label>
                <input type="text" id="nickname" required placeholder="设置你的昵称">
            </div>
            <div>
                <label>邮箱</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div>
                <label>密码</label>
                <input type="password" id="password" required minlength="6" placeholder="至少 6 位">
            </div>
            <div>
                <label>确认密码</label>
                <input type="password" id="confirm" required minlength="6" placeholder="再次输入密码">
            </div>
            <button type="submit">注册</button>
        </form>
        <p>已有账户？<a href="login.html">去登录</a></p>
    </main>

    <footer>
        <p>温州县域公交信息平台 © 2026 版权所有</p>
        <p>温馨提示：本平台为公益性信息平台，无任何商业运营行为</p>
        <p>数据更新时间：2026年8月</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("msg");
            msg.className = "";
            msg.textContent = "";

            const nickname = document.getElementById("nickname").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm").value;

            if (password !== confirm) {
                msg.textContent = "两次密码输入不一致";
                msg.className = "error";
                return;
            }

            try {
                const { data, error } = await register(email, password);
                if (error) throw error;
                if (data.user) {
                    const { error: updateErr } = await setNickname(data.user.id, nickname);
                    if (updateErr) console.error("昵称保存失败", updateErr);
                }
                if (data.user && !data.session) {
                    msg.textContent = "注册成功";
                    msg.className = "success";
                    return;
                }
                window.location.href = "../index.html";
            } catch (err) {
                if (err == 'Invalid login credentials') msg.textContent = '邮箱 / 密码错误';
                else msg.textContent = err.message;
                msg.className = "error";
            }
        });
    </script>
</body>

</html>
